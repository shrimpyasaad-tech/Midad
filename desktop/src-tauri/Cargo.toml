[package]
name = "midad"
version = "1.0.0"
description = "Midad: Arabic screenwriting"
edition = "2021"

[lib]
name = "midad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
