<style>
/* Layout: a writer's desk — header + element toolbar on top, navigator on the start side, a true A4 page in the middle */
:root {
  --desk: #E2E6ED;
  --surface: #F4F6F9;
  --paper: #FFFFFF;
  --ink: #1A2030;
  --muted: #5B6476;
  --line: #CBD2DD;
  --soft: #EDF0F5;
  --accent: #B5302A;      /* revision-pencil red */
  --accent-soft: #F6E1DF;
  --cue: #1D6B74;         /* camera / graphics cues */
  --cue-soft: #DDEEF0;
  --focus: #F7F3E6;
  --shadow: 0 1px 2px rgba(26,32,48,.08), 0 8px 28px rgba(26,32,48,.10);
  --f-display: "Reem Kufi", "Midad Plex", system-ui, sans-serif;
  --f-ui: "Midad Plex", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  --f-page: "Midad Naskh", "Noto Naskh Arabic", "Traditional Arabic", serif;
  --script-size: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0F1218; --surface: #171B23; --paper: #1D222C; --ink: #E6E9F0; --muted: #98A1B4;
    --line: #2D3442; --soft: #232935; --accent: #FF7B6B; --accent-soft: #3A2224;
    --cue: #63C4CE; --cue-soft: #17323A; --focus: #252A22; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0F1218; --surface: #171B23; --paper: #1D222C; --ink: #E6E9F0; --muted: #98A1B4;
  --line: #2D3442; --soft: #232935; --accent: #FF7B6B; --accent-soft: #3A2224;
  --cue: #63C4CE; --cue-soft: #17323A; --focus: #252A22; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--desk); color: var(--ink); font-family: var(--f-ui); overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { height: 100%; display: grid; grid-template-rows: auto auto 1fr; }

/* ---------- header ---------- */
.top { background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 700; font-size: 22px; color: var(--ink); }
.brand svg { width: 18px; height: 22px; }
.brand svg path { fill: var(--accent); }
.title-in { flex: 1 1 200px; min-width: 0; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 6px 8px; font-size: 16px; font-weight: 600; }
.title-in:hover { border-color: var(--line); }
.title-in:focus { border-color: var(--accent); background: var(--paper); outline: none; }
.seg-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--paper); }
.seg-toggle button { border: 0; background: transparent; padding: 6px 12px; font-size: 14px; color: var(--muted); }
.seg-toggle button[aria-pressed="true"] { background: var(--ink); color: var(--paper); font-weight: 600; }
.stat { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat b { color: var(--ink); font-weight: 600; }
.status { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; border: 0; background: transparent; padding: 4px 6px; border-radius: 6px; }
.status:hover { background: var(--soft); }
.status i { width: 7px; height: 7px; border-radius: 50%; background: var(--cue); display: inline-block; flex: none; }
.status.busy i { background: var(--muted); }
.status.warn i { background: #C08A1E; }
.status.err i { background: var(--accent); }
.tbtn { border: 1px solid var(--line); background: var(--paper); border-radius: 7px; padding: 6px 11px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.tbtn:hover { border-color: var(--muted); }
.tbtn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.only-narrow { display: none; }

/* ---------- toolbar ---------- */
.tools { background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 7px;
  display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: thin; }
.tools .lbl { font-size: 12px; color: var(--muted); margin-inline-end: 4px; white-space: nowrap; }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 4px 11px; font-size: 13px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.chip kbd { font-family: var(--f-ui); font-size: 11px; color: var(--muted); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chip.on kbd { color: var(--accent); }
.chip.cue { border-style: dashed; color: var(--cue); }
.sep { width: 1px; align-self: stretch; background: var(--line); margin-inline: 4px; flex: none; }
.icon-btn { border: 0; background: transparent; padding: 5px 8px; border-radius: 6px; font-size: 15px; color: var(--muted); }
.icon-btn:hover { background: var(--soft); color: var(--ink); }
.icon-btn:disabled { opacity: .35; cursor: default; background: transparent; }

/* ---------- main ---------- */
.main { min-height: 0; display: grid; grid-template-columns: 290px 1fr; }
.side { background: var(--surface); border-inline-end: 1px solid var(--line); min-height: 0; display: flex; flex-direction: column; }
.side-tabs { display: flex; border-bottom: 1px solid var(--line); padding-inline: 8px; }
.side-tabs button { flex: 1; border: 0; background: transparent; padding: 10px 4px; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; }
.side-tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.side-body { overflow-y: auto; padding: 10px 10px 40px; flex: 1; min-height: 0; }
.side-note { font-size: 12px; color: var(--muted); padding: 4px 6px 10px; line-height: 1.6; margin: 0; }

.nav-item { display: grid; grid-template-columns: 2.2em 1fr auto; gap: 6px; align-items: baseline; padding: 7px 8px; border-radius: 7px; cursor: pointer; font-size: 13px; line-height: 1.5; border: 1px solid transparent; }
.nav-item:hover { background: var(--soft); }
.nav-item.cur { background: var(--paper); border-color: var(--line); }
.nav-item .n { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
.nav-item .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item .p { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.nav-item.drag-over { border-color: var(--accent); border-style: dashed; }
.nav-item.dragging { opacity: .4; }

.ch-item { padding: 8px; border-radius: 7px; display: grid; gap: 4px; }
.ch-item:hover { background: var(--soft); }
.ch-row { display: flex; align-items: center; gap: 8px; }
.ch-name { font-weight: 600; font-size: 14px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.ch-meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 4px; background: var(--soft); border-radius: 2px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.ch-rename { width: 100%; border: 1px solid var(--accent); border-radius: 5px; padding: 3px 6px; background: var(--paper); }

.lib-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 2px 12px; }
.lib-item { padding: 9px 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; display: grid; grid-template-columns: minmax(0, 1fr); gap: 3px; }
.lib-item > * { min-width: 0; }
.lib-item:hover { background: var(--soft); }
.lib-item.cur { background: var(--paper); border-color: var(--line); }
.lib-title { font-weight: 600; font-size: 14px; display: flex; gap: 8px; align-items: center; }
.lib-title span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.badge.show { background: var(--cue-soft); color: var(--cue); }
.lib-meta { font-size: 12px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
.lib-meta .acts { margin-inline-start: auto; display: flex; gap: 2px; }
.lib-meta .acts button { border: 0; background: transparent; color: var(--muted); font-size: 12px; padding: 2px 6px; border-radius: 5px; }
.lib-meta .acts button:hover { background: var(--line); color: var(--ink); }
.confirm { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--accent); }
.confirm button { border: 1px solid var(--line); background: var(--paper); border-radius: 5px; padding: 1px 8px; font-size: 12px; }
.confirm button.yes { background: var(--accent); color: #fff; border-color: var(--accent); }

.desk { overflow: auto; min-height: 0; padding-block: 28px 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- paper: film ---------- */
.paper { background: var(--paper); box-shadow: var(--shadow); margin-inline: auto; border-radius: 3px; color: var(--ink); position: relative; }
.paper.film { counter-reset: scene; font-family: var(--f-page); }
.el { white-space: pre-wrap; overflow-wrap: break-word; outline: none; position: relative; border-radius: 2px; }
.el.is-empty::before { content: attr(data-ph); color: var(--muted); opacity: .55; pointer-events: none; }
.el.cur { background: var(--focus); box-shadow: 0 0 0 5px var(--focus); }
.el-scene { counter-increment: scene; }
.el-scene::after { content: counter(scene, arabic-indic); position: absolute; inset-inline-start: -2.4em; top: 0; color: var(--accent); font-family: var(--f-ui); font-weight: 600; font-size: .85em; }
.latin .el-scene::after { content: counter(scene); }

/* true page geometry: every length is points × --u (set by script) */
.paper.film.pageview { width: calc(595.28 * var(--u)); font-size: calc(12 * var(--u)); line-height: calc(19 * var(--u));
  padding: calc(72 * var(--u)) calc(108 * var(--u)) calc(86 * var(--u)) calc(72 * var(--u)); }
[dir="ltr"] .paper.film.pageview { padding: calc(72 * var(--u)) calc(72 * var(--u)) calc(86 * var(--u)) calc(108 * var(--u)); }

/* phone reflow view: same content, fluid layout */
.paper.film.reflow { max-width: 794px; padding-block: 32px 64px; padding-inline-start: 38px; padding-inline-end: 16px; font-size: var(--script-size); line-height: 1.6; }
.reflow .el-scene { font-weight: 700; margin-top: 2em; }
.reflow .el-action { margin-top: 1em; }

});

/* ================= fountain-style text ================= */
const isSceneLine = l => /^\.(?!\.)/.test(l) || /^(INT|EXT|INT\.?\/EXT|I\/E)[\s.]/i.test(l) || /^(داخلي|خارجي|د\/خ)(\s|\/|-|–|\.)/.test(l) || /^مشهد\s*[\d٠-٩]*/.test(l);
function parseFountain(txt) {
  const lines = txt.replace(/\r\n?/g, '\n').split('\n'); const meta = {}; let i = 0;
  if (/^[^\s:][^:]{0,30}:\s*\S/.test(lines[0] || '') && !isSceneLine(lines[0])) {
    while (i < lines.length && lines[i].trim()) {
      const m = lines[i].match(/^([^:]+):\s*(.*)$/);
      if (m) { const k = m[1].trim().toLowerCase(); if (/title|العنوان/.test(k)) meta.title = m[2]; else if (/author|credit|تأليف|الكاتب|كتابة/.test(k)) meta.author = meta.author || m[2]; else if (/draft|date|المسودة|التاريخ/.test(k)) meta.draft = m[2]; }
      i++;
    }
  }
  const blocks = []; let b = [];
  for (; i < lines.length; i++) { const l = lines[i].replace(/\s+$/, ''); if (!l.trim()) { if (b.length) blocks.push(b), b = []; } else b.push(l.trim()); }
  if (b.length) blocks.push(b);
  const els = []; const known = new Set();
  const dialogueFrom = rest => { let d = []; const fl = () => { if (d.length) els.push({ t: 'dialogue', x: d.join('\n') }), d = []; }; rest.forEach(l => { if (/^\(.*\)$/.test(l)) { fl(); els.push({ t: 'paren', x: l }); } else d.push(l); }); fl(); };
  blocks.forEach(bl => {
    const L = bl[0];
    if (isSceneLine(L)) {
      const x = L.replace(/^\.(?!\.)/, '').replace(/^مشهد\s*[\d٠-٩]*\s*[:\-–—ـ.]*\s*/, '').trim();
      els.push({ t: 'scene', x }); if (bl.length > 1) els.push({ t: 'action', x: bl.slice(1).join('\n') }); return;
    }
    if (/^>/.test(L) && !/<$/.test(L)) { els.push({ t: 'transition', x: L.replace(/^>\s*/, '') }); return; }
    if (TRANSITIONS.includes(L) || (bl.length === 1 && /(إلى|TO):$/.test(L) && L.length < 25)) { els.push({ t: 'transition', x: L }); return; }
    if (/^@/.test(L)) { const n = L.slice(1).trim(); known.add(baseName(n)); els.push({ t: 'character', x: n }); dialogueFrom(bl.slice(1)); return; }
    const short = L.length <= 32 && L.split(/\s+/).length <= 5 && !/[.!؟?،,]$/.test(L);
    const latinCaps = /^[A-Z0-9 .'()-]+$/.test(L) && /[A-Z]/.test(L);
    if (bl.length > 1 && short && (/[:：]$/.test(L) || known.has(baseName(L)) || latinCaps)) {
      const n = L.replace(/[:：]\s*$/, '').trim(); known.add(baseName(n)); els.push({ t: 'character', x: n }); dialogueFrom(bl.slice(1)); return;
    }
    const inl = bl.length === 1 && L.match(/^([^:：]{1,24})[:：]\s+(.+)$/);
    if (inl && inl[1].trim().split(/\s+/).length <= 3) { const n = inl[1].trim(); known.add(baseName(n)); els.push({ t: 'character', x: n }); els.push({ t: 'dialogue', x: inl[2] }); return; }
    els.push({ t: 'action', x: bl.join('\n') });
  });
  return { meta, els };
}
function toFountain(s) {
  const L = [`Title: ${s.title || ''}`];
  if (s.author) L.push(`Author: ${s.author}`); if (s.draft) L.push(`Draft date: ${s.draft}`); if (s.notes) L.push(`Contact: ${s.notes.replace(/\n/g, ' / ')}`);
  L.push('');
  s.els.forEach((e, k) => {
    const x = (e.x || '').trim(); if (!x && e.t !== 'scene') return;
    if (e.t === 'scene') L.push('', '.' + (x || '—'), '');
    else if (e.t === 'action') L.push(x, '');
    else if (e.t === 'character') L.push('', '@' + x);
    else if (e.t === 'paren') L.push(/^\(.*\)$/.test(x) ? x : '(' + x + ')');
    else if (e.t === 'dialogue') L.push(x);
    else if (e.t === 'transition') L.push('', '> ' + x, '');
    const nx = s.els[k + 1];
    if ((e.t === 'dialogue' || e.t === 'paren' || e.t === 'character') && !(nx && (nx.t === 'dialogue' || nx.t === 'paren'))) L.push('');
  });
  return L.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
}
function toPrompter(s) {
  let out = (s.title || '') + '\n\n';
  s.els.forEach(e => {
    if (e.t === 'seg') out += `== ${e.x || 'فقرة'} ==\n\n`;
    else if (e.t === 'row' && (e.a || '').trim()) out += `${(e.s || '').trim() ? e.s.trim() + ':\n' : ''}${e.a.trim()}\n\n`;
  });
  return out.replace(/\n{3,}/g, '\n\n').trim() + '\n';
}
function toCSV(s) {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const tm = showTiming(s.els); let seg = '';
  const rows = [['الفقرة', 'الصورة', 'المتحدث', 'الصوت', 'المدة (ث)', 'يبدأ عند'].map(q).join(',')];
  s.els.forEach((e, i) => { if (e.t === 'seg') seg = e.x; else { const r = tm.rows.get(i); const st = r.start; rows.push([seg, e.v, e.s, e.a, r.s, `${Math.floor(st / 60)}:${String(st % 60).padStart(2, '0')}`].map(q).join(',')); } });
  return '﻿' + rows.join('\r\n');
}

.hint{font-family:"Midad Plex",system-ui,sans-serif;max-width:${PAGE.w}pt;margin:20px auto 0;padding:12px 16px;background:#fff8e1;border:1px solid #f0d78c;border-radius:8px;font-size:14px;line-height:1.7}
@media print{html{background:#fff}.hint{display:none}}

function printFilm(s) {

.pg:last-child{break-after:auto;page-break-after:auto}
@media print{.pg{margin:0;box-shadow:none}}

${geoRules('.pg', n => n + 'pt')}

  pg.pages.forEach((items, p) => {
    body += `<section class="pg"><div class="num">${p ? N(p + 1) : ''}</div><div class="body">`;
    items.forEach(it => {

      body += `<p class="k k-${it.t}" style="margin-top:${(it.g || 0) * PAGE.lh}pt">${sn}${esc(it.x)}</p>`;

function printShow(s) {

  const css = `.sheet{background:#fff;max-width:210mm;margin:20px auto;padding:20mm 20mm 20mm 20mm;box-shadow:0 2px 14px rgba(0,0,0,.12)}
@page{margin:18mm}@media print{.sheet{box-shadow:none;margin:0;padding:0;max-width:none}}
.tp{min-height:230mm;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;break-after:page;position:relative}

table{width:100%;border-collapse:collapse;font-size:11.5pt;line-height:1.7}thead th{font-family:"Midad Plex",sans-serif;font-size:9pt;color:#555;text-align:start;border-bottom:2px solid #111;padding:4pt 6pt}

  let rows = '';
  s.els.forEach((e, i) => {

    else { const r = tm.rows.get(i); rows += `<tr><td class="v">${esc(e.v)}</td><td class="a">${e.s ? `<b>${esc(e.s)}</b>` : ''}${esc(e.a)}</td><td class="t">${mmss(r.s)}<br>${mmss(r.start + r.s)}</td></tr>`; }
  });
  const tp = `<section class="tp"><h1>${esc(s.title || '')}</h1>${s.author ? `<div class="by">إعداد<br><b>${esc(s.author)}</b></div>` : ''}<div class="foot">${esc([s.draft, s.notes].filter(Boolean).join('\n'))}</div></section>`;
  const body = `<div class="sheet">${tp}<table><thead><tr><th>الصورة</th><th>الصوت</th><th>الزمن</th></tr></thead><tbody>${rows}</tbody></table><div class="total">المدة الكلية: <b>${mmss(tm.total)}</b></div></div>`;
  return printShell(s.title, css, body);
}

/* ================= toast & global keys ================= */
let toastEl = null, toastT;
function toast(msg, actLabel, act, sticky) {
  if (toastEl) toastEl.remove();
  toastEl = document.createElement('div'); toastEl.className = 'toast'; toastEl.dir = 'rtl'; toastEl.setAttribute('role', 'status');
  toastEl.innerHTML = `<span>${esc(msg)}</span>${actLabel ? `<button>${esc(actLabel)}</button>` : ''}`;
  if (actLabel) toastEl.querySelector('button').addEventListener('click', () => { act(); toastEl && toastEl.remove(); });
  document.body.appendChild(toastEl); clearTimeout(toastT); if (!sticky) toastT = setTimeout(() => { toastEl && toastEl.remove(); toastEl = null; }, 5200);
}
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && !e.altKey && e.code === 'KeyZ') { if (e.target.closest && e.target.closest('input:not(.dur),textarea')) return; e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && e.code === 'KeyY') { e.preventDefault(); redo(); }
  else if (mod && e.code === 'KeyS') { e.preventDefault(); toast(cloud.col ? 'الحفظ تلقائي، والمزامنة مع حسابك تلقائية أيضاً' : 'الحفظ تلقائي — كل تعديل محفوظ'); }
  else if (e.key === 'Escape') { closePop(); acClose(); }
});
const onResize = debounce(() => { if (cur().mode === 'film') { layoutPaper(); drawMarks(lastPg); } }, 120);
window.addEventListener('resize', () => { acClose(); closePop(); onResize(); });
$('#desk').addEventListener('scroll', () => acClose(), { passive: true });

/* ================= boot ================= */
window.__midad = { fb, paginate: els => paginate(els), store: () => store, cloud, mergeScripts, PAGE, fontsReady, printFilm: s => printFilm(s), cur };
applySettings();
loadScript(store.curId && store.scripts.some(s => s.id === store.curId) ? store.curId : store.scripts[0].id);
refreshStatus();
fontsReady.then(() => { if (cur().mode === 'film') updateDerived(); });
function bootCaps(tries) {
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then(d => { dl = d; }).catch(() => {});
    initCloud();
  } else if (tries > 0) setTimeout(() => bootCaps(tries - 1), 400);
}
if (BUILD === 'artifact') bootCaps(6);
if (BUILD === 'pwa') {
  initPwa();
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {

    navigator.serviceWorker.register('sw.js').then(reg => {
      const ask = w => toast('نسخة جديدة من مداد جاهزة', 'حدّث الآن', () => { wantReload = true; w.postMessage('skipWaiting'); }, true);

      reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) ask(w); }); });
      setInterval(() => reg.update().catch(() => {}), 3600000);
    }).catch(() => {});
  }
}
})();
